<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puma Homepage</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;700&display=swap');
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col justify-between">

    <header class="bg-black text-white px-6 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-6">
            <a href="#" class="inline-block">
                <img src="puma.png" alt="Puma Logo" class="h-6 w-auto invert brightness-0">
            </a>
            <nav class="hidden md:flex space-x-5 text-sm font-medium tracking-wide">
                <a href="#" class="hover:underline">Home</a>
                <a href="#" class="hover:underline">Men</a>
                <a href="#" class="hover:underline">Women</a>
                <a href="#" class="hover:underline">Kids</a>
                <a href="#" class="hover:underline">About</a>
                <a href="#" class="hover:underline">Contact Us</a>
            </nav>
        </div>

        <div class="flex items-center space-x-2">
            <input 
                type="text" 
                placeholder="Search..." 
                class="bg-white text-black px-3 py-1 rounded text-sm w-48 focus:outline-none"
            >
            <button class="text-sm font-medium hover:text-gray-300 transition-colors px-2 py-1">
                Search
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center text-center px-4 py-20">
        <div class="max-w-xl mx-auto flex flex-col items-center">
            
            <div class="bg-black p-4 mb-8 inline-block">
                <img src="puma.png" alt="Puma Big Logo" class="w-24 h-auto block mx-auto">
            </div>

            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 tracking-tight mb-4">
                Welcome to Puma
            </h1>

            <p class="text-gray-600 text-base md:text-lg mb-8 max-w-md">
                Explore our latest collection of shoes, clothing, and accessories
            </p>

            <a 
                href="#" 
                class="bg-black text-white font-bold px-8 py-3 rounded-md hover:bg-gray-800 transition-all inline-block shadow-sm"
            >
                Shop Now
            </a>
            
        </div>
    </main>

</body>
</html>
